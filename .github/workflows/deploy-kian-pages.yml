name: Publish Kian Price portfolio to GitHub Pages

on:
  push:
    branches: [kian-price-portfolio]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kian-price-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Kian portfolio branch
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate static portfolio
        run: bun run build
      - name: Check static output
        run: |
          test -f .output/public/index.html
          grep -q "Kian Price" .output/public/index.html
          cp .output/public/index.html .output/public/404.html
          touch .output/public/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
